<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huffman-Codierung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="title">Huffman-Codierung</h1>
    <label class="lang"><span data-i18n="language">Sprache</span>
      <select id="lang"><option value="de">Deutsch</option><option value="en">English</option></select>
    </label>
  </header>

  <main>
    <section class="panel row">
      <label class="grow"><span data-i18n="textLabel">Text:</span>
        <textarea id="text" rows="1" autocomplete="off" spellcheck="false" data-i18n-placeholder="textPlaceholder">ABRAKADABRA</textarea>
      </label>
      <fieldset>
        <legend data-i18n="modeLabel">Modus:</legend>
        <label><input type="radio" name="mode" value="show" checked autocomplete="off"> <span data-i18n="modeShow">Anzeigen</span></label>
        <label><input type="radio" name="mode" value="build" autocomplete="off"> <span data-i18n="modeBuild">Selbst bauen</span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="weightLabel">Anzeige:</legend>
        <label><input type="radio" name="weight" value="abs" checked autocomplete="off"> <span data-i18n="weightAbs">Häufigkeit</span></label>
        <label><input type="radio" name="weight" value="rel" autocomplete="off"> <span data-i18n="weightRel">Wahrscheinlichkeit</span></label>
      </fieldset>
    </section>

    <section class="panel">
      <div class="buttons">
        <button id="prev" data-i18n="prev">Zurück</button>
        <button id="next" data-i18n="next">Weiter</button>
        <button id="all" data-i18n="all">Ganzen Baum zeigen</button>
        <button id="undo" data-i18n="undo">Rückgängig</button>
        <button id="reveal" data-i18n="revealCodes">Codewörter auslesen</button>
        <button id="encode" data-i18n="encodeText">Text codieren</button>
        <button id="reset" data-i18n="reset">Neu beginnen</button>
      </div>
      <p id="message" class="message" role="status"></p>
      <div id="tree" class="tree"></div>
    </section>

    <section id="results" class="panel results">
      <div id="legendBox">
        <h2 data-i18n="legend">Legende</h2>
        <div id="legend"></div>
      </div>
      <div id="encodeBox">
        <div class="head">
          <h2 data-i18n="encodedTitle">Codierter Text</h2>
          <label class="sub"><input type="checkbox" id="spaced" autocomplete="off"> <span data-i18n="spaced">Mit Abständen</span></label>
        </div>
        <div id="encoded" class="mono"></div>
        <h2 data-i18n="statsTitle">Kennzahlen</h2>
        <ul id="stats"></ul>
        <h2 data-i18n="decodeTitle">Decodieren</h2>
        <input id="bits" class="mono" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="decodePlaceholder">
        <p id="decoded"></p>
      </div>
    </section>
  </main>

  <script src="js/huffman.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
